name: Universal Android & Flutter APK Builder

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # --- Flutter প্রজেক্ট হলে এই অংশটি চলবে ---
      - name: Setup Flutter
        if: hashFiles('pubspec.yaml') != ''
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build Flutter APK
        if: hashFiles('pubspec.yaml') != ''
        run: |
          flutter pub get
          flutter build apk --release

      # --- Native Android (Java/Kotlin) প্রজেক্ট হলে এই অংশটি চলবে ---
      - name: Setup Gradle (if gradlew is missing)
        if: hashFiles('pubspec.yaml') == '' && hashFiles('gradlew') == ''
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Native Android APK
        if: hashFiles('pubspec.yaml') == ''
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      # --- তৈরি হওয়া APK ডাউনলোডের জন্য আপলোড ---
      - name: Upload Built APK
        uses: actions/upload-artifact@v4
        with:
          name: Compiled-App-APK
          path: |
            app/build/outputs/apk/**/*.apk
            build/app/outputs/flutter-apk/*.apk
